<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>This frame is empty · Little Frames</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/Little-Frames/icon.png">
<style>
  /* Served by GitHub Pages for any missing URL, at any depth, so every path here is absolute. */
  @font-face { font-family: Gaegu; font-weight: 700; src: url(/Little-Frames/fonts/gaegu-700.woff2) format('woff2'); font-display: swap; }
  @font-face { font-family: Nunito; font-weight: 700; src: url(/Little-Frames/fonts/nunito-700.woff2) format('woff2'); font-display: swap; }
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font-family: Nunito, system-ui, sans-serif; color: #4a3d37; background: #f5efe6;
    background-image: radial-gradient(rgba(120, 95, 80, .16) 1px, transparent 1.4px); background-size: 22px 22px;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; max-width: 420px; }
  .polaroid {
    position: relative; width: 220px; padding: 14px 14px 52px; background: #fbf7ef; transform: rotate(-4deg);
    border-radius: 3px 5px 4px 6px / 5px 3px 6px 4px;
    box-shadow: 0 1px 2px rgba(70, 50, 40, .12), 0 10px 20px -8px rgba(70, 50, 40, .32);
  }
  .tape {
    position: absolute; top: -11px; left: 50%; width: 84px; height: 23px; transform: translateX(-50%) rotate(-3deg);
    background: repeating-linear-gradient(90deg, rgba(232, 168, 176, .78) 0 7px, rgba(244, 212, 214, .78) 7px 14px);
    clip-path: polygon(2% 0, 98% 4%, 100% 50%, 97% 100%, 3% 96%, 0 50%);
  }
  .photo {
    aspect-ratio: 1; background: #f1ebe1; border-radius: 2px; display: grid; place-items: center;
    outline: 1.5px dashed rgba(110, 85, 75, .3); outline-offset: -10px;
  }
  .photo span { font-family: Gaegu, cursive; font-weight: 700; font-size: 64px; color: rgba(110, 85, 75, .45); }
  .caption { position: absolute; left: 0; right: 0; bottom: 14px; font-family: Gaegu, cursive; font-size: 22px; color: #5b4a42; transform: rotate(-1deg); }
  h1 { margin: 0; font-family: Gaegu, cursive; font-weight: 700; font-size: 44px; line-height: 1; }
  p { margin: 0; color: #8d7e75; font-size: 15.5px; line-height: 1.5; }
  a.home {
    display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 16px; text-decoration: none;
    font-weight: 700; color: #6a3c42; background: #f4c9cd; box-shadow: 0 6px 14px -8px rgba(106, 60, 66, .6);
    transition: transform .2s;
  }
  a.home:hover { transform: translateY(-2px) rotate(-1deg); }
  a.home:focus-visible { outline: 2px dashed #a0555e; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { a.home { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="polaroid" aria-hidden="true">
    <div class="tape"></div>
    <div class="photo"><span>?</span></div>
    <div class="caption">nothing here yet</div>
  </div>
  <h1>this frame is empty</h1>
  <p>The page you were looking for isn't here. It may have moved, or the link has a small typo.</p>
  <a class="home" href="/Little-Frames/">Back to Little Frames</a>
</main>
</body>
</html>
